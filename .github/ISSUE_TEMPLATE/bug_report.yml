name: Bug report
description: A defect in the package, documentation, website, or examples
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: '@ponchia/ui version'
      description: Use the installed version, or main and a commit if reporting a website or documentation issue.
      placeholder: '0.16.2'
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - CSS (ui-* component / token)
        - tokens (JS/JSON/DTCG)
        - classes (cls / recipes / .d.ts)
        - behaviors (vanilla JS)
        - glyphs / icons / readouts
        - connectors / annotations / renderer helpers
        - documentation / website / examples
        - build / exports / packaging
    validations:
      required: true
  - type: input
    id: consumer
    attributes:
      label: Environment or framework
      description: Framework and version, plain HTML, Node.js, or the affected documentation/example page. Do not include private project names or secrets.
      placeholder: 'Plain HTML, Vite, or a documentation URL'
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component / token / class involved
      placeholder: 'ui-button, --accent-text, initDialog…'
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal markup/CSS/JS, or a public link. Note theme (light/dark), RTL, density/contrast presets if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser + version
      description: The floor is Chrome/Edge 125+, Safari 18+, Firefox 129+.
      placeholder: 'Safari 18'
