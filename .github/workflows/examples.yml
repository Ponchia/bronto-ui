# Reusable consumer smoke: pack the real tarball and build every example
# against it (not a workspace symlink), so a broken published surface — bad
# exports map, missing file, unresolved subpath — fails here before a
# release can ship it. validate's check:pack only inspects the file
# allowlist; it does not build a consumer, so this is a distinct gate.
#
# Runs packed examples in the same pinned Playwright container as E2E,
# avoiding repeat browser downloads on each example runner.
# Called by BOTH ci.yml and release.yml via `workflow_call` — one matrix
# definition, no drift between the merge path and the release path. Manual
# runs always take the deeper chromium+firefox+webkit packed smoke without
# exposing user-controlled build-shaping inputs.
name: examples

on:
  workflow_call:
    inputs:
      cross_browser:
        description: >
          Run packed browser smokes in chromium, firefox, and webkit. Default
          false keeps the normal PR/release examples matrix Chromium-only;
          manual CI/reusable callers can set true for the deeper consumer pass.
        type: boolean
        default: false
      visual_smoke:
        description: >
          Add desktop + mobile screenshot/layout health smokes for each packed
          example. This checks for blank, under-painted, or horizontally
          overflowing output without committing platform-specific PNG baselines.
        type: boolean
        default: false
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.examples.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: examples
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { EXAMPLE_NAMES, BROWSER_SMOKE_EXAMPLE_NAMES } from './scripts/lib/examples.mjs';
          console.log('matrix=' + JSON.stringify(EXAMPLE_NAMES.map(example => ({example, smoke: BROWSER_SMOKE_EXAMPLE_NAMES.includes(example)}))));
          JS

  build:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pinned Playwright image already includes chromium, firefox, webkit,
    # system dependencies and fonts. Installing all browsers separately in
    # every example leg intermittently stalls until the 15-minute job timeout.
    # Reuse the same browser build as the E2E/visual jobs instead.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    env:
      # Firefox needs HOME owned by the root user inside this job container.
      HOME: /root
    # Container jobs default to /bin/sh. The example smoke uses Bash arrays
    # for optional visual/cross-browser arguments, so explicitly keep Bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Like the existing E2E container job, setup-node's npm cache cannot
      # restore reliably inside the container. Avoid the wasted cache step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build and smoke the ${{ matrix.example }} packed example
        env:
          EXAMPLE: ${{ matrix.example }}
          CROSS_BROWSER: ${{ github.event_name == 'workflow_dispatch' || inputs.cross_browser }}
          VISUAL_SMOKE: ${{ github.event_name == 'workflow_dispatch' || inputs.visual_smoke }}
        run: |
          args=()
          if [ "$VISUAL_SMOKE" = "true" ]; then
            args+=(--visual)
          fi
          args+=("$EXAMPLE")
          if [ "$CROSS_BROWSER" = "true" ]; then
            npm run test:examples:cross-browser -- "${args[@]}"
          else
            npm run test:examples -- "${args[@]}"
          fi
