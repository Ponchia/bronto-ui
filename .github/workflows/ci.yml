# Validation only. Runs on every PR, and on direct pushes to `main`.
#
# We deliberately do NOT also run on every branch push: a push and its PR
# fall in different `concurrency` groups (push ref `refs/heads/<branch>`
# vs PR ref `refs/pull/<n>/merge`), so each branch push with an open PR
# ran the WHOLE pipeline — e2e included — twice. PRs already cover feature
# branches; `main` pushes still run so a direct commit is validated and
# Pages can deploy from a green commit.
#
# This workflow NEVER publishes or creates a release — see release.yml,
# which is gated on `v*` tags. Successful main CI can deploy the website
# through pages.yml; it does not publish a package to npm.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual full run: dispatch on any branch to exercise firefox + webkit
  # and the cross-browser packed examples before merging an engine-sensitive
  # CSS/behavior/consumer change. Keep this input-free so the build graph
  # cannot be altered by user parameters.
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Uniform npm network resilience across jobs (replaces the ad-hoc
# `npm ci || sleep && npm ci` retry — npm's own request-level retry is
# more robust and covers install AND build steps).
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  # Detect Markdown/docs-only changes so the expensive cross-browser e2e (~8 min)
  # and the consumer-tarball example matrix are skipped when nothing but
  # Markdown docs changed. The docs viewer shell (`docs/index.html`) is app
  # code: it owns routing, sanitisation, and mobile nav, so it must still run
  # browser e2e. `check` ALWAYS runs — it has doc-scanning gates (check:report
  # validates docs use real classes; check:release validates the CHANGELOG).
  # Self-contained git diff (no third-party action, in keeping with the repo's
  # SHA-pinned/zero-extra-deps posture) and FAILS SAFE: any uncertainty
  # (empty/unknown range, first push, force-push) → heavy=true → full pipeline.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
      engine_sensitive: ${{ steps.detect.outputs.engine_sensitive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE_SHA"...HEAD)" || files=""
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only "$BEFORE_SHA" HEAD)" || files=""
          else
            files=""   # unknown range → fail safe below
          fi
          # Only declare a Markdown/docs-only change when the diff is
          # NON-EMPTY and EVERY path is Markdown or LICENSE; empty/unknown →
          # heavy=true (run everything). `docs/index.html` is executable docs
          # app code, not cheap prose, so it intentionally falls through to
          # heavy=true. (Uses string emptiness, not `grep -q` exit codes —
          # those differ BSD vs GNU.)
          heavy=true
          if [ -n "$files" ]; then
            nondoc="$(printf '%s\n' "$files" | grep -vE '(\.md$|^LICENSE$)' || true)"
            [ -z "$nondoc" ] && heavy=false
          fi
          # Browser coverage follows the rendered product: runtime modules,
          # site/demo/example sources, docs app code, shared build/server
          # scripts, and the workflows/dependencies that execute them. Keep
          # scripts/ broad so a new rendering helper cannot evade this gate.
          # Unknown diffs still run every engine.
          engine_sensitive=true
          if [ -n "$files" ]; then
            engine="$(printf '%s\n' "$files" | grep -E '^(css/|dist/|behaviors/|fonts/|tokens/|classes/|glyphs/|annotations/|connectors/|renderer/|site/|demo/|examples/|scripts/|test/e2e/|docs/.*\.(html|css|[cm]?js)$|\.github/workflows/|playwright\.config\.mjs$|package(-lock)?\.json$)' || true)"
            [ -z "$engine" ] && engine_sensitive=false
          fi
          echo "Changed files:"; printf '%s\n' "$files"
          echo "heavy=$heavy engine_sensitive=$engine_sensitive"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "engine_sensitive=$engine_sensitive" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Verify the locked release CLI
        run: |
          npm ci --prefix tooling/npm --ignore-scripts --no-audit --no-fund
          node tooling/npm/node_modules/npm/bin/npm-cli.js --version
          node tooling/npm/node_modules/npm/bin/npm-cli.js pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/release-tooling-pack.json"

      # Stylelint + integrity checks + node:test unit/contract suite.
      - run: npm run check

  # Consumer smoke + end-to-end regression, defined ONCE as reusable
  # workflows and shared with release.yml so the release path can't drift
  # from what every PR runs. Skipped on docs-only changes (see `changes`).
  examples:
    needs: [check, changes]
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/examples.yml
    with:
      cross_browser: ${{ github.event_name == 'workflow_dispatch' }}
      visual_smoke: ${{ github.event_name == 'workflow_dispatch' }}

  # Chromium-only for cheap changes. Risky PRs and pushes to main run the
  # full firefox/webkit pass too when the change touches an engine-sensitive
  # surface (runtime, site/demo, shared scripts, or browser build inputs) — cross-engine-
  # only-at-tag-time is how a deterministic WebKit defect merged green and
  # then burned two release attempts (v0.6.1/v0.6.2). Manual workflow_dispatch
  # always runs the cross-engine pass as the any-branch escape hatch.
  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      cross_engine: ${{ github.event_name == 'workflow_dispatch' || ((github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.engine_sensitive == 'true') }}

  # Fail the deployment gate if approved layout contracts fail.
  # Reuse the manually-dispatchable workflow; avoid duplicate PR/push runs.
  layout:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/layout-contract-smoke.yml

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image digest locks Semgrep and its Python/system dependencies.
    # Update instructions and the deliberately current rule feed are documented
    # in .github/tooling/README.md.
    container:
      image: semgrep/semgrep:1.166.0@sha256:c180f0c93a17b420c0af5006214a29d3c747c5459c732b740191adf657dd0068
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the full, current p/default feed and .semgrepignore behavior.
      # Preserve every finding, including reviewed audit false positives.
      # The gate accepts only exact reviewed source locations and file bytes.
      - name: Run Semgrep SAST
        run: |
          status=0
          semgrep scan \
            --config p/default \
            --error \
            --metrics=off \
            --disable-version-check \
            --json-output "${RUNNER_TEMP}/semgrep.json" \
            --sarif-output "${RUNNER_TEMP}/semgrep.sarif" \
            . || status=$?
          case "$status" in
            0|1) python3 scripts/semgrep-gate.py "${RUNNER_TEMP}/semgrep.json" .github/tooling/semgrep-baseline.json ;;
            *) exit "$status" ;;
          esac

      - name: Retain full Semgrep evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-results
          path: |
            ${{ runner.temp }}/semgrep.json
            ${{ runner.temp }}/semgrep.sarif
          if-no-files-found: error
          retention-days: 7

  # The single required status check on main owns the complete job graph.
  # A failed classifier must not turn skipped browser jobs into a green gate.
  # Only a successful docs-only classification may skip examples, e2e, or layout.
  ci-gate:
    if: always()
    needs: [changes, check, examples, e2e, layout, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required CI results
        env:
          R_CHANGES: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          R_CHECK: ${{ needs.check.result }}
          R_EXAMPLES: ${{ needs.examples.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_LAYOUT: ${{ needs.layout.result }}
          R_SAST: ${{ needs.sast.result }}
        run: |
          set -euo pipefail
          echo "changes=$R_CHANGES heavy=$HEAVY check=$R_CHECK examples=$R_EXAMPLES e2e=$R_E2E layout=$R_LAYOUT sast=$R_SAST"
          for r in "$R_CHANGES" "$R_CHECK" "$R_SAST"; do
            if [ "$r" != "success" ]; then
              echo "::error::change classification, integrity checks, and SAST execution must succeed (got '$r')"
              exit 1
            fi
          done
          if [ "$HEAVY" != "true" ] && [ "$HEAVY" != "false" ]; then
            echo "::error::change classification did not produce a valid heavy flag"
            exit 1
          fi
          for r in "$R_EXAMPLES" "$R_E2E" "$R_LAYOUT"; do
            if [ "$r" = "success" ]; then
              continue
            fi
            if [ "$HEAVY" = "false" ] && [ "$r" = "skipped" ]; then
              continue
            fi
            echo "::error::a required browser, layout contract or example job did not pass (got '$r', heavy='$HEAVY')"
            exit 1
          done
          echo "All required CI jobs passed; skips are limited to confirmed docs-only changes."
