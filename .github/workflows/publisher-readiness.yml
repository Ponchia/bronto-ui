# Observation only: this workflow cannot approve a release or obtain npm OIDC credentials.
name: Publisher readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Audit upstream source and patched dependencies without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install, audit, and qualify only if the complete audit passes
        run: npm run publisher:readiness -- "$RUNNER_TEMP"
      - name: Retain the result even when the publisher is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publisher-readiness
          path: |
            ${{ runner.temp }}/publisher-source-readiness-*/readiness.json
            ${{ runner.temp }}/publisher-source-readiness-*/failure.json
            ${{ runner.temp }}/publisher-source-readiness-*/audit.json
            ${{ runner.temp }}/publisher-source-readiness-*/pack.json
            ${{ runner.temp }}/publisher-source-readiness-*/install.log
            ${{ runner.temp }}/publisher-source-readiness-*/runtime/package*.json
          if-no-files-found: error
          retention-days: 7
