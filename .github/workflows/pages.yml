# Publish the static BrontoUI product website, docs, fixtures and runtime.
# Only the documentation HTML is generated; the library code and fixtures
# remain the committed sources of truth. Never publishes npm or releases.
name: Pages

# Deploy only after CI (check + containerised e2e) has gone green on
# main — never publish a demo from a commit whose gates failed. (Was a
# bare push trigger, which could ship a broken/red-e2e demo; flagged in
# review.)
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Least privilege; deploy opts into exactly what Pages needs.
permissions:
  contents: read

# Never cancel an in-flight deploy; serialise Pages updates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual dispatch always; the CI-completion trigger only when it
    # actually succeeded (workflow_run fires on failure too). Manual dispatch is
    # limited to main so Pages cannot publish an arbitrary un-gated ref.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # configure-pages enablement
      # no id-token here: OIDC is only minted by deploy-pages in `deploy`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run is allowed to deploy only protected main. Do not check
          # out the event SHA expression directly; verify it after checkout.
          ref: main
          persist-credentials: false

      - name: Verify Pages deploy target
        if: github.event_name == 'workflow_run'
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"

      # The source-only fixture checkout hid missing imported modules on Pages.
      # Assemble + validate the *actual static artifact* including the entire
      # browser import graph, docs pages and curated public content.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run site:build

      - name: Verify published modules and routes
        run: npm run check:site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
