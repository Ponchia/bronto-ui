# Non-pixel WebKit e2e on pinned Ubuntu Noble. Called only by e2e.yml when
# cross_engine is true. This is NOT a visual-baseline generator: Chromium
# snapshots and Firefox remain on pinned Jammy. Nothing is skipped from the
# WebKit project, and Playwright's existing retry and trace policies apply.
name: e2e WebKit Noble

on:
  workflow_call:

permissions:
  contents: read

env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run WebKit non-pixel e2e
        id: e2e
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npx playwright test --project=webkit --shard="$SHARD"/3

      - name: Determine browser report retention
        id: reports
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
          const flaky = report.stats?.flaky;
          if (!Number.isInteger(flaky) || flaky < 0) {
            throw new Error('Playwright JSON report is missing a valid flaky count');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `flaky=${flaky > 0}\n`);
          NODE

      - if: failure() || steps.reports.outputs.flaky == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
