# Manual, read-only reproduction for #250's intermittent Firefox demo modal
# click/scroll symptom. Use the ORIGINAL quality test, unchanged assertions,
# pinned CI Firefox image, zero retries and repeated runs across worker counts.
# A passing test set does not close the issue or justify relaxing the gate.
name: Firefox dialog click diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:e1529a04087193966ea15d4a1617345bdaa0791690a24ab2c42b65f9ce5b2cdc
    env:
      HOME: /root
      DEBUG: 'pw:api,pw:browser*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Repeat the original dark-theme demo modal test without retries
        shell: bash
        env:
          REPRO_WORKERS: ${{ matrix.workers }}
        run: |
          set -euo pipefail
          printf 'SHA=%s\nUTC=%s\nWORKERS=%s\n' "$GITHUB_SHA" "$(date -u --iso-8601=seconds)" "$REPRO_WORKERS"
          uname -a
          npx playwright test test/e2e/quality.spec.mjs \
            --project=firefox \
            --grep 'quality — demo runs clean \(dark\)' \
            --repeat-each=40 \
            --workers="$REPRO_WORKERS" \
            --retries=0
      - name: Retain first-failure traces and machine-readable test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-dialog-workers-${{ matrix.workers }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error
