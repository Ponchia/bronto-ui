# Manual, read-only reproduction of the WebKit navigation/resize crash (#250).
# The original e2e assertions remain untouched; 0 retries makes each crash visible.
name: WebKit crash diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:e1529a04087193966ea15d4a1617345bdaa0791690a24ab2c42b65f9ce5b2cdc
    env:
      HOME: /root
      DEBUG: 'pw:browser*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Repeat reports fallback without retries
        shell: bash
        env:
          REPRO_WORKERS: ${{ matrix.workers }}
        run: |
          set -euo pipefail
          { date -u --iso-8601=seconds; uname -a; free -k || true; ulimit -a; } > "$RUNNER_TEMP/webkit-processes.log"
          (
            while :; do
              date -u --iso-8601=seconds
              grep -E '^(MemAvailable|MemFree|SwapFree):' /proc/meminfo || true
              # cgroup counters distinguish a browser OOM kill from a DOM/resize failure.
              for metric in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak; do
                if [ -r "$metric" ]; then
                  printf '%s: ' "$metric"
                  tr '\n' ' ' < "$metric"
                  echo
                fi
              done
              ps -eo pid,comm,rss | awk '$2 ~ /WebKit|MiniBrowser|WebProcess|NetworkProcess/ { print }' || true
              sleep 3
            done
          ) >> "$RUNNER_TEMP/webkit-processes.log" 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          npx playwright test test/e2e/public-site.spec.mjs \
            --project=webkit \
            --grep 'public site — each example points to real source and has a mobile fallback' \
            --repeat-each=30 \
            --workers="$REPRO_WORKERS" \
            --retries=0
      - name: Retain browser and process diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-crash-workers-${{ matrix.workers }}
          path: |
            ${{ runner.temp }}/webkit-processes.log
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error
