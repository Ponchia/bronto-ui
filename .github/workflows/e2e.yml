# Reusable end-to-end gate: visual snapshots + axe a11y both themes +
# behavioural + forced-colors/reduced-motion/print + no-console-error/404,
# optionally across Firefox/WebKit (see `cross_engine`). Chromium and Firefox
# retain the pinned Jammy baseline container. WebKit's non-pixel suite uses a
# separately pinned Noble image through the nested reusable workflow to avoid
# intermittent Jammy browser-process crashes without touching pixel baselines.
#
# Called by BOTH ci.yml and release.yml via `workflow_call` — one
# definition, no drift. (These used to be two near-identical copies that
# had already diverged: CI had a registry-retry the release path lacked.)
# CI calls it chromium-only for cheap changes and cross-engine for risky PRs;
# release.yml calls it with cross_engine: true so the full firefox/webkit pass
# gates the publish.
name: e2e

on:
  workflow_call:
    inputs:
      cross_engine:
        description: >
          Run firefox + webkit too. Default false → chromium only (the
          pixel/visual + a11y + behaviour gate, the high-frequency
          regression surface, ~half the wall-clock). CI passes true for
          engine-sensitive PRs/main pushes; release.yml passes true so the
          cross-engine pass (the engine-specific `:has()`/`color-mix()`/
          `<dialog>`/`@starting-style` risk) gates the actual publish.
        type: boolean
        default: false

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Uniform npm network resilience for every npm invocation here (replaces
# the ad-hoc `npm ci || sleep && npm ci` shell retry — npm's own
# request-level retry is more robust and covers install AND build steps).
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Backstop so a hung browser/webServer can't burn a runner for the 6h
    # GitHub default. The suite itself is ~8 min.
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:e1529a04087193966ea15d4a1617345bdaa0791690a24ab2c42b65f9ce5b2cdc
    # The job container runs as root but GitHub sets $HOME=/github/home
    # (uid 1001); Firefox refuses to launch unless $HOME is owned by the
    # current user. Documented Playwright-on-GHA workaround.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache: npm` here on purpose: inside the pinned container the
      # setup-node npm cache never restores (the container's cache path
      # isn't pre-seeded), so it only added a wasted post-step tar. The
      # devDeps install in a few seconds regardless.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Chromium retains every spec (including pixel baselines); Firefox runs
      # its non-pixel project here only when cross_engine. The separately
      # required Noble workflow owns all WebKit non-pixel tests in that case.
      - name: Run e2e (Chromium and optional Firefox)
        id: e2e
        env:
          CROSS_ENGINE: ${{ inputs.cross_engine }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$CROSS_ENGINE" = "true" ]; then
            npx playwright test --project=chromium --project=firefox --shard="$SHARD"/3
          else
            npx playwright test --project=chromium --shard="$SHARD"/3
          fi

      # A passing retry is useful failure evidence too. Keep those reports
      # without uploading the ordinary successful run's empty diagnostics.
      - name: Determine browser report retention
        id: reports
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
          const flaky = report.stats?.flaky;
          if (!Number.isInteger(flaky) || flaky < 0) {
            throw new Error('Playwright JSON report is missing a valid flaky count');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `flaky=${flaky > 0}\n`);
          NODE

      - if: failure() || steps.reports.outputs.flaky == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The caller workflow succeeds only if both required browser jobs succeed.
  # On Chromium-only PRs this job is intentionally skipped; release and all
  # engine-sensitive changes still require WebKit's full non-pixel matrix.
  webkit:
    if: inputs.cross_engine
    uses: ./.github/workflows/e2e-webkit-noble.yml
