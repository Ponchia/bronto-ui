# Release is tag-driven and explicit. It triggers ONLY on a pushed
# `v*` tag — never on a branch or main push. Cutting a release is a
# deliberate `git tag vX.Y.Z && git push --tags`, not a side effect of
# merging to main.
#
# GATING: the npm publish IS the gate for the documented install path.
# `validate` runs read-only checks + tag ancestry/version matches;
# `publish-preflight` records the pack manifest/size after all gates; and
# `publish-npm` only runs after a protected-environment approval, so a failing
# check means the version is never on npm and consumers never resolve it.
# (GitHub still serves the raw tag tarball `archive/refs/tags/vX.Y.Z.tar.gz`
# for any tag, ungated — that path is legacy/fallback, not the documented
# install; see docs/architecture.md.)
#
# The e2e + examples gates are the SAME reusable workflows ci.yml runs
# (.github/workflows/{e2e,examples}.yml) — one definition, never a drifted
# copy. The release runs them at full strength: examples adds the packed
# chromium/firefox/webkit smoke plus desktop/mobile visual health, and e2e adds
# full firefox/webkit coverage regardless of the change classifier — so every
# publish is gated on all engines plus packed-example health.
#
# DIST-TAG ROUTING: a stable tag (`v0.4.0`) publishes to `latest`, so
# `npm i @ponchia/ui` resolves it. A SemVer prerelease tag (`v0.4.0-rc.1`,
# anything with a hyphenated identifier) publishes to `next` instead —
# consumers opt in with `@ponchia/ui@next` and `latest` never silently
# moves onto an unstable build. The GitHub Release is flagged prerelease
# to match. A stable tag OLDER than the registry's current `latest` (a
# backport, or an older release re-run after a newer one published)
# publishes to `maint-<major>.<minor>` and is not marked GitHub "Latest",
# so `latest` only ever moves forward. publish-npm derives all of this from
# the tag and the registry (scripts/release-dist-tag.mjs); nothing to set.
#
# CREDENTIALS: there are none. Publishing uses npm TRUSTED PUBLISHING
# (OIDC) — GitHub mints a short-lived, workflow-scoped token that npm
# exchanges at publish time, so nothing long-lived is stored in a secret
# and there is no expiry to miss. The trusted publisher is registered on
# npmjs.com against this exact identity: repository `Ponchia/bronto-ui`,
# workflow filename `release.yml`, environment `npm-publish`. Renaming
# this file, or moving the publish out of that environment, breaks
# publishing until the npm-side registration is updated to match.
# Also requires a committed LICENSE file before the first publish.
name: Release

on:
  push:
    tags: ['v*']

# Default read-only. Each job opts into exactly the scope it needs.
permissions:
  contents: read

# Serialize releases. Two tags pushed close together must not race the
# `latest`/`next` dist-tag pointer (last-writer-wins). Never cancel an
# in-flight release — a half-finished publish is worse than a queue.
concurrency:
  group: release-publish
  cancel-in-progress: false

# Uniform npm network resilience (matches ci.yml).
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::release tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from origin/main"
            exit 1
          fi

      - run: npm ci

      - name: Verify the locked release CLI
        run: |
          node scripts/source-publisher.mjs prepare "${RUNNER_TEMP}/bronto-publisher"
          node scripts/source-publisher.mjs audit "${RUNNER_TEMP}/bronto-publisher" "${RUNNER_TEMP}/publisher-validation-audit.json"
          node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" --version
          node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/release-tooling-pack.json"

      - run: npm run check

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

  # Reused, not re-implemented (these jobs used to be duplicated here and
  # had drifted — the release copies lacked the registry retry CI had).
  # publish-preflight needs these; a release must not skip what merge-to-main
  # runs, with full cross-engine coverage on every release.
  e2e:
    needs: validate
    # Full cross-engine pass gates every publish.
    uses: ./.github/workflows/e2e.yml
    with:
      cross_engine: true

  examples:
    needs: validate
    uses: ./.github/workflows/examples.yml
    with:
      cross_browser: true
      visual_smoke: true

  publish-preflight:
    needs: [validate, e2e, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install upstream npm source and locked patched dependencies
        run: node scripts/source-publisher.mjs prepare "${RUNNER_TEMP}/bronto-publisher"

      - name: Audit actual installed publishing tooling
        run: node scripts/source-publisher.mjs audit "${RUNNER_TEMP}/bronto-publisher" "${RUNNER_TEMP}/publishing-tooling-audit.json"

      - name: Capture publish preflight summary
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/pack.json"
          npm run size:report > "${RUNNER_TEMP}/size-report.txt"
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = require('node:path');
          const tmp = process.env.RUNNER_TEMP;
          const pack = JSON.parse(fs.readFileSync(path.join(tmp, 'pack.json'), 'utf8'))[0];
          const size = fs.readFileSync(path.join(tmp, 'size-report.txt'), 'utf8').trim();
          console.log('## Publish preflight');
          console.log('');
          console.log(`Package: ${pack.name}@${pack.version}`);
          console.log(`Files: ${pack.files.length}`);
          console.log(`Packed size: ${pack.size} bytes`);
          console.log(`Unpacked size: ${pack.unpackedSize} bytes`);
          console.log('');
          console.log('### Size report');
          console.log('');
          console.log('```text');
          console.log(size);
          console.log('```');
          console.log('');
          console.log('### Pack manifest');
          console.log('');
          for (const file of pack.files) console.log(`- ${file.path} (${file.size} B)`);
          NODE

      - name: Retain publisher audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publishing-tooling-audit-preflight
          path: ${{ runner.temp }}/publishing-tooling-audit.json*
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: publish-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Manual approval gate: this job is the ONLY thing that reaches npm, so
    # it runs in the `npm-publish` Environment (required-reviewer protection
    # rule). After the gates and preflight pass, the run pauses here until a
    # maintainer approves in the Actions UI — a deliberate guard against an
    # accidental tag push publishing. The environment is also half of the
    # npm trusted-publisher identity (see below), so no other job — or
    # future workflow — can mint a publish credential for this package.
    environment: npm-publish
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
    permissions:
      contents: read
      # OIDC. This is what npm exchanges for a short-lived publish
      # credential, and what signs the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org
          # Publish must not restore dependency caches into an OIDC-enabled job.
          package-manager-cache: false

      # Install only the private source-publisher project, using its committed integrity
      # lock and unchanged upstream CLI source. No global install, project devDependencies, or lifecycle scripts
      # execute in this privileged job. See .github/tooling/README.md.
      - name: Install upstream npm source and locked patched dependencies
        run: node scripts/source-publisher.mjs prepare "${RUNNER_TEMP}/bronto-publisher"

      - name: Audit actual installed publishing tooling
        run: node scripts/source-publisher.mjs audit "${RUNNER_TEMP}/bronto-publisher" "${RUNNER_TEMP}/publishing-tooling-audit.json"

      # Publish with --ignore-scripts so the OIDC credential is never
      # exposed to the prepack/prepublishOnly lifecycle (the whole
      # check+build surface + devDeps). Safe because the committed
      # artifacts were already byte-verified by `validate` and summarized by
      # `publish-preflight` on this exact commit — so we ship exactly what
      # was validated, not a re-build. prepublishOnly stays the intrinsic
      # guard for any non-CI/manual publish.
      #
      # --tag is explicit on every path: a bare `npm publish` defaults to
      # `latest`, so a prerelease would otherwise hijack the default
      # install. scripts/release-dist-tag.mjs routes prereleases to `next`
      # and a stable older than the registry's `latest` to
      # `maint-<major>.<minor>` (see header). Fails closed: no registry
      # answer, no publish.
      - name: Choose the dist-tag
        id: dist-tag
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          current_latest=""
          for _ in 1 2 3 4 5; do
            if current_latest="$(node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" view @ponchia/ui dist-tags.latest)"; then
              break
            fi
            current_latest=""
            sleep 5
          done
          dist_tag="$(node scripts/release-dist-tag.mjs "$version" "$current_latest")" || {
            echo "::error::cannot route $version: registry latest is '${current_latest}'"
            exit 1
          }
          echo "Registry latest is '$current_latest'; $version goes to dist-tag '$dist_tag'"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.dist_tag }}
        run: |
          dist_tag="$DIST_TAG"
          echo "Publishing ${GITHUB_REF_NAME#v} to dist-tag '$dist_tag'"
          node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" publish --ignore-scripts --tag "$dist_tag"

      - name: Record npm registry state
        continue-on-error: true
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          view_ok=false
          attempts_remaining=5
          while [ "$attempts_remaining" -gt 0 ]; do
            if node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" view "@ponchia/ui@$version" version dist.integrity dist.tarball --json > "${RUNNER_TEMP}/npm-view.json"; then
              view_ok=true
              break
            fi
            attempts_remaining=$((attempts_remaining - 1))
            sleep 5
          done
          tags_ok=false
          if node "${RUNNER_TEMP}/bronto-publisher/source/bin/npm-cli.js" view @ponchia/ui dist-tags --json > "${RUNNER_TEMP}/npm-dist-tags.json"; then
            tags_ok=true
          fi

          {
            echo ''
            echo '## npm registry state'
            echo ''
            if [ "$view_ok" = true ] && [ "$tags_ok" = true ]; then
              node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const tmp = process.env.RUNNER_TEMP;
          const view = JSON.parse(fs.readFileSync(path.join(tmp, 'npm-view.json'), 'utf8'));
          const tags = JSON.parse(fs.readFileSync(path.join(tmp, 'npm-dist-tags.json'), 'utf8'));
          console.log('```json');
          console.log(JSON.stringify({ published: view, distTags: tags }, null, 2));
          console.log('```');
          NODE
            else
              echo '> npm publish completed, but the post-publish registry observation did not return a complete response.'
              echo ''
              echo "- package lookup: $view_ok"
              echo "- dist-tag lookup: $tags_ok"
              echo ''
              echo "Verify manually with \`npm view @ponchia/ui version dist-tags --json\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain publisher audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publishing-tooling-audit-publisher
          path: ${{ runner.temp }}/publishing-tooling-audit.json*
          if-no-files-found: error
          retention-days: 7

  release-notes:
    # Gate on a successful publish — never announce a GitHub Release for
    # a version that failed to reach npm (no split-brain). publish-npm itself
    # needs publish-preflight, which needs [validate, e2e, examples], so the
    # gate is transitive.
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # contents:write is for the Release API, not git — don't leave a
      # usable git credential on disk for the action to inherit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Release body IS the curated, narrative CHANGELOG section for this
      # tag — not GitHub's auto-generated PR list. One source of truth
      # (CHANGELOG.md), surfaced where users read it.
      - name: Extract the CHANGELOG section for this tag
        # Route github.ref_name through env, never inline into the shell, so a
        # crafted tag name can't break out of the command (semgrep ERROR; the
        # tag is maintainer-controlled, but env-routing is the safe idiom).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs "$REF_NAME" > "${RUNNER_TEMP}/release-body.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          # Flag prerelease tags (hyphenated SemVer) so the GitHub Release
          # matches the `next` dist-tag and is not surfaced as "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          # GitHub marks a new Release "Latest" by default; only the run that
          # moved npm's `latest` may, so a maint-* backport never does.
          make_latest: ${{ needs.publish-npm.outputs.dist_tag == 'latest' }}
